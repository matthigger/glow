[tool.poetry]
name = "glow"
version = "0.1.0"
description = "General Linear Models Optimized with Ward's Method"
authors = ["matt higger <mhigger@ccs.neu.edu>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
joblib = "^1.3.2"
matplotlib = "^3.8.2"
nibabel = "^5.1.0"
numpy = "^1.26.2"
pandas = "^2.1.3"
pillow = "^10.1.0"
pytest = "^7.4.3"
scikit-learn = "^1.3.2"
scipy = "^1.11.4"
seaborn = "^0.13.0"
tqdm = "^4.66.1"
imageio = "^2.34.0"
cloudpickle = "^3.0.0"
plotly = "^5.24.1"
platformdirs = "^4.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.urls]
"Homepage" = "https://github.com/matthigger/glow"