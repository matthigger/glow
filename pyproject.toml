[project]
name = "glow"
version = "0.1.0"
description = "General Linear Models Optimized with Ward's Method"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "matt higger", email = "mhigger@ccs.neu.edu"}
]

[tool.poetry]
name = "glow"
version = "0.1.0"
description = "General Linear Models Optimized with Ward's Method"
authors = ["matt higger <mhigger@ccs.neu.edu>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
dash = ">=2.17"
dash-daq = ">=0.6"
dash-slicer = ">=0.3"
joblib = ">=1.3"
matplotlib = ">=3.8"
nibabel = ">=5.1"
numba = ">=0.59"
numpy = ">=1.26"
pandas = ">=2.1"
pillow = ">=10.1"
platformdirs = ">=4.4"
plotly = ">=5.24"
pytest = ">=7.4"
pyyaml = ">=6.0"
scikit-learn = ">=1.3"
scipy = ">=1.11"
seaborn = ">=0.13"
tqdm = ">=4.66"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.urls]
"Homepage" = "https://github.com/matthigger/glow"