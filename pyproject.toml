[tool.poetry]
name = "hrba"
version = "0.1.0"
description = "Hierarchical Region Based Analysis"
authors = ["Matt Higger <mhigger@ccs.neu.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
joblib = "^1.3.2"
matplotlib = "^3.8.2"
nibabel = "^5.1.0"
numpy = "^1.26.2"
pandas = "^2.1.3"
Pillow = "^10.1.0"
pytest = "^7.4.3"
scikit-learn = "^1.3.2"
scipy = "^1.11.4"
seaborn = "^0.13.0"
tqdm = "^4.66.1"
rpy2 = "^3.5.14"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.urls]
"Homepage" = "https://github.com/matthigger/hrba"