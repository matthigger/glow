[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short

# Ignore profiling scripts
norecursedirs = .git __pycache__ htmlcov .pytest_cache venv

# Filter known warnings
filterwarnings =
    # ignore joblib fork warning in parallel tests (library issue)
    ignore:This process.*is multi-threaded.*use of fork\(\):DeprecationWarning:joblib
